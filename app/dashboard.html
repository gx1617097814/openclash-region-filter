<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClash 地区过滤</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#69778b; --line:#dce3ea; --soft:#f5f7fa; --teal:#087f75; --green:#159447; --blue:#2563eb; --red:#c53b32; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    body { margin:0; background:#f6f8fa; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { min-height:62px; padding:9px 24px; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:18px; }
    h1 { margin:0; font-size:20px; } h2 { margin:0; font-size:17px; } h3 { margin:0; font-size:15px; }
    main { max-width:1220px; margin:auto; padding:20px; }
    section { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
    .head { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:14px; }
    .hint,.meta { color:var(--muted); font-size:12px; line-height:1.45; }
    button { min-height:36px; border:1px solid var(--teal); border-radius:6px; padding:7px 11px; color:#fff; background:var(--teal); cursor:pointer; font-size:13px; white-space:nowrap; }
    button.secondary { color:var(--teal); background:#fff; } button.danger { color:var(--red); background:#fff; border-color:#efc5c1; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    input,select { width:100%; height:38px; border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:#fff; color:var(--ink); font-size:13px; }
    .pill { display:inline-flex; align-items:center; min-height:25px; padding:3px 8px; border-radius:999px; border:1px solid var(--line); font-size:12px; color:var(--muted); }
    .pill.live { color:#087443; border-color:#b9ddc8; background:#f1fbf5; }
    .subscriptions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .sub-card { border:1px solid var(--line); border-radius:8px; padding:12px; display:grid; gap:9px; min-width:0; align-content:start; }
    .sub-card.active { border-color:#70aaa4; box-shadow:inset 3px 0 var(--teal); }
    .sub-title { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .sub-title h3 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sub-summary { margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:11px; }
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 12px; }
    .stat { min-width:0; } .stat span { display:block; font-size:11px; color:var(--muted); } .stat strong { font-size:13px; overflow-wrap:anywhere; }
    .quota { display:grid; gap:5px; }
    .quota-line { display:flex; justify-content:space-between; gap:10px; align-items:baseline; font-size:12px; }
    .quota-detail { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); font-size:11px; }
    .quota-bar { height:7px; background:#e6ebf0; border-radius:99px; overflow:hidden; }
    .quota-fill { height:100%; background:var(--green); }
    .quota-fill.medium { background:#d18a00; }
    .quota-fill.low { background:var(--red); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; }
    .region-controls { display:flex; flex-wrap:wrap; gap:8px; align-items:end; justify-content:flex-end; }
    .compact-field { display:grid; gap:4px; color:var(--muted); font-size:11px; }
    .compact-field select { width:128px; height:36px; }
    .workspace { display:grid; grid-template-columns:minmax(0,1.7fr) minmax(300px,.75fr); gap:16px; align-items:start; }
    .regions { display:grid; gap:10px; }
    .region { border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .region-head { min-height:58px; padding:10px 12px; display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:12px; align-items:center; }
    .region-title strong { display:block; } .region-title span { color:var(--muted); font-size:12px; }
    .region-summary { display:flex; flex-wrap:wrap; gap:4px 10px; margin-top:2px; }
    .region-summary .fastest { text-align:left; }
    .toggle { width:44px; height:24px; min-height:24px; padding:2px; border:0; border-radius:99px; background:#cbd5e1; display:flex; }
    .toggle::after { content:""; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 3px #0003; }
    .toggle.on { background:var(--green); justify-content:flex-end; }
    .expand { color:var(--muted); background:#fff; border-color:var(--line); width:34px; padding:4px; }
    .node-list { display:none; border-top:1px solid var(--line); background:#fafbfc; }
    .region.open .node-list { display:block; }
    .node { min-height:43px; padding:7px 12px; border-bottom:1px solid #e9edf1; display:grid; grid-template-columns:minmax(0,1fr) 70px 66px; gap:10px; align-items:center; }
    .node:last-child { border-bottom:0; } .node-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
    .latency { font-size:12px; color:var(--muted); text-align:right; } .latency.good { color:#087443; } .latency.mid { color:#b26a00; } .latency.bad { color:var(--red); }
    .node button { min-height:30px; padding:4px 8px; } .node button.current { border-color:#b9ddc8; background:#f1fbf5; color:#087443; }
    .side { display:grid; gap:16px; } .side section { margin:0; } .side .head { align-items:flex-start; flex-direction:column; gap:4px; }
    .selected { padding:12px; border:1px solid var(--line); background:var(--soft); border-radius:8px; display:flex; justify-content:space-between; gap:12px; align-items:center; overflow-wrap:anywhere; }
    .selected .latency { flex:0 0 auto; }
    .selected.pending { border-color:#d6a43a; background:#fffaf0; }
    .result { margin:0; min-height:180px; max-height:360px; overflow:auto; white-space:pre-wrap; word-break:break-word; padding:12px; border-radius:8px; background:#101827; color:#dce7f7; font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
    dialog { width:min(560px,calc(100% - 30px)); border:1px solid var(--line); border-radius:8px; padding:0; box-shadow:0 18px 50px #0003; }
    dialog::backdrop { background:#11182766; } .dialog-body { padding:18px; display:grid; gap:14px; }
    .dialog-body .head { margin-bottom:2px; }
    .dialog-close { width:38px; padding:0; font-size:21px; line-height:1; color:var(--muted); border-color:var(--line); }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:2px; }
    .field { display:grid; gap:5px; } .field label { font-size:12px; color:var(--muted); }
    #feedback { position:fixed; right:22px; top:76px; z-index:20; width:min(340px,calc(100% - 44px)); }
    .notice { background:#fff; border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:6px; padding:10px 12px; box-shadow:0 8px 24px #0f172a24; font-size:13px; }
    .notice.ok { border-left-color:var(--green); } .notice.bad { border-left-color:var(--red); }
    .header-status { display:flex; align-items:center; justify-content:flex-end; min-width:0; }
    .confirm-copy { margin:0; color:var(--muted); font-size:13px; line-height:1.6; }
    .loading { min-height:90px; display:grid; place-items:center; color:var(--muted); font-size:13px; }
    @media(max-width:880px) { header{padding:9px 14px}main{padding:14px}.subscriptions{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}.region-controls{width:100%;justify-content:flex-start}.region-head{grid-template-columns:minmax(0,1fr) auto auto}.node{grid-template-columns:minmax(0,1fr) 58px 58px} }
  </style>
</head>
<body>
<header><h1>OpenClash 地区过滤</h1><div class="header-status"><span id="idleStatus" class="pill live">自动运行中</span></div></header>
<main>
  <section>
    <div class="head"><div><h2>订阅配置</h2><div class="hint">每个订阅独立保存地区、刷新频率、额度和测速记录，同一时间只激活一个。</div></div><button onclick="openEditor()">添加订阅</button></div>
    <div id="subscriptions" class="subscriptions"><div class="loading">正在读取已缓存的订阅状态</div></div>
  </section>
  <div class="workspace">
    <section>
      <div class="head"><div><h2>地区与节点</h2><div class="hint">先调整地区和待用节点，确认后统一保存；测速不会自动切换。</div></div><div class="region-controls"><label class="compact-field">自动测速<select id="latencyInterval" onchange="saveLatencyInterval(this)"><option value="0">关闭</option><option value="7200">每 2 小时</option><option value="14400">每 4 小时</option><option value="28800">每 8 小时</option><option value="43200">每 12 小时</option></select></label><button class="secondary" id="testBtn" onclick="testAll(this)">全部测速</button><button id="saveBtn" onclick="saveChanges(this)" disabled>保存并应用</button></div></div>
      <div id="regions" class="regions"><div class="loading">正在读取已缓存的地区与节点</div></div>
    </section>
    <aside class="side">
      <section><div class="head"><h2>当前节点</h2><span id="latencyTime" class="meta"></span></div><div id="selected" class="selected">读取中</div></section>
      <section><div class="head"><h2>最近结果</h2></div><pre id="result" class="result">暂无运行结果</pre></section>
    </aside>
  </div>
</main>
<div id="feedback"></div>
<dialog id="editor"><form method="dialog" class="dialog-body" onsubmit="saveProfile(event)">
  <div class="head"><h2 id="editorTitle">添加订阅</h2><button type="button" class="secondary dialog-close" onclick="$('editor').close()" aria-label="关闭">×</button></div>
  <input id="editId" type="hidden">
  <div class="field"><label for="editName">订阅名称</label><input id="editName" required maxlength="80"></div>
  <div class="field"><label for="editUrl">订阅地址</label><input id="editUrl" type="url" required></div>
  <div class="field"><label for="editRefresh">刷新时间</label><select id="editRefresh"><option value="1800">每 30 分钟</option><option value="3600">每 1 小时</option><option value="7200">每 2 小时</option><option value="21600">每 6 小时</option><option value="43200">每 12 小时</option><option value="86400">每天</option></select></div>
  <div class="dialog-actions"><button type="button" class="secondary" onclick="$('editor').close()">取消</button><button id="profileSaveBtn" type="submit">保存设置</button></div>
</form></dialog>
<dialog id="confirmDialog" oncancel="event.preventDefault();resolveConfirm(false)"><div class="dialog-body">
  <div class="head"><h2 id="confirmTitle">确认操作</h2><button type="button" class="secondary dialog-close" onclick="resolveConfirm(false)" aria-label="关闭">×</button></div>
  <p id="confirmMessage" class="confirm-copy"></p>
  <div class="dialog-actions"><button type="button" class="secondary" onclick="resolveConfirm(false)">取消</button><button type="button" id="confirmAction" onclick="resolveConfirm(true)">确认</button></div>
</div></dialog>
<script>
let state=null, noticeTimer=null, confirmResolver=null, regionSaving=false, regionDraft=null, regionDraftProfile='', nodeDraft=null;
const expandedStorageKey='ocfilter-expanded-regions';
const expandedRegions=new Set(readExpandedRegions());
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function readExpandedRegions(){try{const value=JSON.parse(sessionStorage.getItem(expandedStorageKey)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}
function expandedKey(profileId,regionId){return `${profileId}\u0000${regionId}`}
function saveExpandedRegions(){try{sessionStorage.setItem(expandedStorageKey,JSON.stringify([...expandedRegions]))}catch{}}
function notice(message,type="info"){ $("feedback").innerHTML=`<div class="notice ${type}">${esc(message)}</div>`; clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>$("feedback").innerHTML="",3500); }
async function api(path,body){ const response=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}); const data=await response.json(); if(!response.ok||data.ok===false) throw new Error(data.error||"操作失败"); return data; }
async function busy(button,text,task,success='操作完成'){ const old=button?.textContent; if(button){button.disabled=true;button.textContent=text} try{const value=await task();if(success)notice(success,"ok");return value}catch(error){notice(error.message,"bad");return null}finally{if(button){button.disabled=false;button.textContent=old}} }
function active(){return state.config.subscriptions.find(p=>p.id===state.config.active_subscription_id)}
function intervalText(seconds){if(!seconds)return"关闭";if(seconds%86400===0)return`每 ${seconds/86400} 天`;if(seconds%3600===0)return`每 ${seconds/3600} 小时`;return`每 ${seconds/60} 分钟`}
function quotaLevel(percent){return percent<20?'low':percent<60?'medium':'healthy'}
function profileSummary(p){const scan=state.scans[p.id]||{},counts=scan.region_counts||{},labels=new Map((scan.regions||p.regions||[]).map(r=>[r.id,r.label]));const parts=Object.entries(counts).filter(([,count])=>count>0).slice(0,4).map(([id,count])=>`${labels.get(id)||id} ${count}`);return scan.node_count?`${scan.node_count} 个节点${parts.length?' · '+parts.join(' / '):''}`:'尚未读取节点'}
function subscriptionCard(p){const on=p.id===state.config.active_subscription_id,q=p.quota||{},hasPct=q.percent_remaining!==null&&q.percent_remaining!==undefined&&Number.isFinite(Number(q.percent_remaining)),pct=hasPct?Math.max(0,Math.min(100,Number(q.percent_remaining))):0,scan=state.scans[p.id]||{},regionEntries=Object.entries(scan.region_counts||{}).filter(([id,count])=>count>0&&isEnabled(p,{id,default_enabled:(scan.regions||p.regions||[]).find(r=>r.id===id)?.default_enabled})),retained=regionEntries.reduce((sum,[,count])=>sum+count,0),labels=new Map((scan.regions||p.regions||[]).map(r=>[r.id,r.label])),rangeText=!regionEntries.length?'未启用地区':regionEntries.length===1?`${labels.get(regionEntries[0][0])||regionEntries[0][0]} · ${retained} 个节点`:`${regionEntries.length} 个地区 · ${retained} 个节点`,locked=Boolean(state.operation?.active),hasUrl=Boolean(p.source_url),status=locked&&state.operation.profile_id===p.id?'处理中':p.source_pending?'新地址待应用':p.last_result?.cached?'已缓存':p.last_result?(p.last_result.ok?'正常':'需处理'):(p.last_refresh_at?'已缓存':'等待刷新'),quotaTitle=q.ok?'剩余 '+esc(q.remaining_text||'未知'):q.error?esc(q.error):'暂未读取额度',quotaHint=q.ok?`已用 ${esc(q.used_text||'未知')} / ${esc(q.total_text||'未知')} · 到期 ${esc(q.expire_text||'未知')}`:q.checked_at?`检查于 ${esc(q.checked_at)}`:'保存订阅地址后自动读取';return `<article class="sub-card ${on?'active':''}">
  <div class="sub-title"><div><h3>${esc(p.name)}</h3><div class="sub-summary" title="${esc(profileSummary(p))}">${esc(profileSummary(p))}</div></div><span class="pill ${on?'live':''}">${on?'当前使用':'待机'}</span></div>
  <div class="quota"><div class="quota-line"><strong>${quotaTitle}</strong><span>${q.ok&&hasPct?esc(q.percent_remaining)+'%':''}</span></div><div class="quota-bar"><div class="quota-fill ${quotaLevel(pct)}" style="width:${pct}%"></div></div><div class="quota-detail">${quotaHint}</div></div>
  <div class="stats"><div class="stat"><span>刷新频率</span><strong>${esc(intervalText(p.refresh_interval_seconds))}</strong></div><div class="stat"><span>最近刷新</span><strong>${esc(p.last_refresh_at||'尚未刷新')}</strong></div><div class="stat"><span>${on?'运行状态':'缓存状态'}</span><strong>${status}</strong></div><div class="stat"><span>启用范围</span><strong>${esc(rangeText)}</strong></div></div>
  <div class="actions"><button class="secondary" ${(locked||!hasUrl)?'disabled':''} title="${!hasUrl?'请先填写订阅地址':''}" onclick="refreshProfile('${esc(p.id)}',this)">刷新</button><button class="secondary" ${locked?'disabled':''} onclick="openEditor('${esc(p.id)}')">编辑</button><button class="danger" ${(on||locked)?'disabled':''} title="${on?'当前激活订阅不能删除':''}" onclick="deleteProfile('${esc(p.id)}')">删除</button>${on?'<button disabled>已激活</button>':`<button ${(locked||!hasUrl)?'disabled':''} onclick="activateProfile('${esc(p.id)}',this)">激活</button>`}</div>
 </article>`}
function savedEnabled(p,region){return (p.filter.enabled_regions.includes(region.id)||(p.filter.allow_unknown&&region.default_enabled))&&!p.filter.excluded_regions.includes(region.id)}
function isEnabled(p,region){if(regionDraftProfile===p.id&&regionDraft&&Object.prototype.hasOwnProperty.call(regionDraft,region.id))return regionDraft[region.id];return savedEnabled(p,region)}
function hasDraft(){return Boolean(regionDraft&&Object.keys(regionDraft).length)||nodeDraft!==null}
function nodeRegion(name){const p=active(),scan=state.scans[p.id]||{};return (scan.nodes||[]).find(node=>node.name===name)?.region_id||''}
function nodeIsEnabled(name){const p=active(),scan=state.scans[p.id]||{},id=nodeRegion(name),region=(scan.regions||p.regions||[]).find(item=>item.id===id);return Boolean(region&&isEnabled(p,region))}
function latencyClass(delay){return delay==null?'bad':delay<=200?'good':delay<=600?'mid':'bad'}
function fastestNode(nodes,latencies){return nodes.reduce((best,node)=>{const delay=latencies[node.name];return Number.isFinite(delay)&&(!best||delay<best.delay)?{name:node.name,delay}:best},null)}
function regionRow(region){const p=active(),scan=state.scans[p.id]||{},nodes=(scan.nodes||[]).filter(n=>n.region_id===region.id),enabled=isEnabled(p,region),lat=p.latency?.results||{},fastest=fastestNode(nodes,lat),locked=Boolean(state.operation?.active)||regionSaving,summary=fastest?`<span class="latency fastest ${latencyClass(fastest.delay)}" title="${esc(fastest.name)}">最快 ${esc(fastest.name)} · ${fastest.delay} ms</span>`:'<span class="latency fastest bad">暂无测速结果</span>';return `<div class="region ${expandedRegions.has(expandedKey(p.id,region.id))?'open':''}" data-profile="${esc(p.id)}" data-region="${esc(region.id)}"><div class="region-head"><div class="region-title"><strong>${esc(region.label)}</strong><div class="region-summary"><span>${nodes.length} 个节点</span>${summary}</div></div><button class="toggle ${enabled?'on':''}" data-enabled="${enabled}" ${locked?'disabled':''} onclick="toggleRegion(this)" aria-label="切换${esc(region.label)}"></button><button class="expand" onclick="toggleExpanded(this)" title="展开节点">⌄</button></div><div class="node-list">${nodes.map(n=>nodeRow(n.name,enabled,lat[n.name])).join('')}</div></div>`}
function nodeRow(name,enabled,delay){const choice=nodeDraft===null?state.selected_node:nodeDraft,chosen=name===choice,current=name===state.selected_node,locked=Boolean(state.operation?.active)||regionSaving,label=chosen?(nodeDraft===null?'使用中':'待使用'):(current?'恢复':'选择');return `<div class="node"><span class="node-name" title="${esc(name)}">${esc(name)}</span><span class="latency ${latencyClass(delay)}">${delay==null?'超时/未测':`${delay} ms`}</span><button class="secondary ${chosen?'current':''}" data-node="${esc(name)}" ${(!enabled||locked||chosen)?'disabled':''} onclick="chooseNode(this)">${label}</button></div>`}
function operationLabel(kind){return({activate:'切换订阅中',refresh:'刷新订阅中',apply:'保存应用中',latency:'节点测速中',select:'切换节点中'})[kind]||'处理中'}
function renderOperation(){const op=state.operation||{};$("idleStatus").textContent=op.active?operationLabel(op.kind):'自动运行中';$("idleStatus").classList.toggle('live',!op.active)}
function renderSelected(){const p=active(),selected=state.selected_node,delay=selected?p.latency?.results?.[selected]:null,pending=nodeDraft!==null,choice=nodeDraft||'',choiceDelay=choice?p.latency?.results?.[choice]:null;$("selected").classList.toggle('pending',pending);$("selected").innerHTML=pending?(choice?`<span>保存后切换至 ${esc(choice)}</span><span class="latency ${latencyClass(choiceDelay)}">${choiceDelay==null?'超时/未测':`${choiceDelay} ms`}</span>`:'<span>请选择已启用地区中的节点</span>'):(selected?`<span>${esc(selected)}</span><span class="latency ${latencyClass(delay)}">${delay==null?'超时/未测':`${delay} ms`}</span>`:'尚未读取当前节点');const mode=state.runtime_status?.mode,modeText=!p.source_url?'尚未配置':mode==='automatic'?'自动策略，IP 可能变化':mode==='manual'?'手动固定':'状态检查中',testText=p.latency?.last_test_at?`测速：${p.latency.last_test_at}`:'尚未测速';$("latencyTime").textContent=pending?'存在未保存更改':`${modeText} · ${testText}`}
function render(){document.querySelectorAll('.region.open').forEach(row=>expandedRegions.add(expandedKey(row.dataset.profile,row.dataset.region)));saveExpandedRegions();const p=active(),locked=Boolean(state.operation?.active);renderOperation();$("subscriptions").innerHTML=state.config.subscriptions.map(subscriptionCard).join('');const scan=state.scans[p.id]||{},hasNodes=Number(scan.node_count||0)>0,regions=(scan.regions||p.regions||[]).filter(r=>(scan.region_counts?.[r.id]||0)>0);$("regions").innerHTML=regions.length?regions.map(regionRow).join(''):'<div class="hint">请先刷新当前订阅以读取地区和节点。</div>';$("latencyInterval").value=String(p.latency?.interval_seconds??14400);$("latencyInterval").disabled=locked;$("testBtn").disabled=locked||!hasNodes;const choice=nodeDraft===null?state.selected_node:nodeDraft,validChoice=Boolean(choice&&nodeIsEnabled(choice));$("saveBtn").disabled=locked||regionSaving||!hasDraft()||!validChoice;$("saveBtn").textContent=regionSaving?'应用中':'保存并应用';$("saveBtn").title=hasDraft()&&!validChoice?'请先选择已启用地区中的节点':'';renderSelected();$("result").textContent=state.last_result?JSON.stringify(state.last_result,null,2):'暂无运行结果';}
async function refresh(){const response=await fetch('/api/state',{cache:'no-store'});if(!response.ok)throw new Error('状态读取失败');const next=await response.json();if(regionDraftProfile&&regionDraftProfile!==next.config.active_subscription_id){regionDraft=null;regionDraftProfile='';nodeDraft=null;regionSaving=false}state=next;render()}
function askConfirm(title,message,action='确认'){return new Promise(resolve=>{confirmResolver=resolve;$("confirmTitle").textContent=title;$("confirmMessage").textContent=message;$("confirmAction").textContent=action;$("confirmDialog").showModal()})}
function resolveConfirm(value){$("confirmDialog").close();const resolve=confirmResolver;confirmResolver=null;resolve?.(value)}
function openEditor(id=''){const p=state.config.subscriptions.find(x=>x.id===id);$("editorTitle").textContent=p?'编辑订阅':'添加订阅';$("editId").value=p?.id||'';$("editName").value=p?.name||'';$("editUrl").value=p?.source_url||'';$("editRefresh").value=String(p?.refresh_interval_seconds||3600);$("editor").showModal()}
async function saveProfile(event){event.preventDefault();const button=$("profileSaveBtn"),old=button.textContent;button.disabled=true;button.textContent='保存并读取额度';try{const result=await api('/api/subscriptions/save',{id:$("editId").value,name:$("editName").value,source_url:$("editUrl").value,refresh_interval_seconds:Number($("editRefresh").value)});$("editor").close();notice(result.quota_available===false?'订阅已保存，未读取到额度信息':'订阅已保存','ok');await refresh()}catch(error){notice(error.message,'bad')}finally{button.disabled=false;button.textContent=old}}
async function deleteProfile(id){const p=state.config.subscriptions.find(item=>item.id===id);if(!await askConfirm('删除订阅',`将删除“${p?.name||'该订阅'}”及其缓存记录，此操作不会影响当前运行配置。`,'删除'))return;try{await api('/api/subscriptions/delete',{id});notice('订阅已删除','ok');await refresh()}catch(error){notice(error.message,'bad')}}
async function saveLatencyInterval(select){select.disabled=true;try{await api('/api/subscriptions/save',{id:active().id,latency_interval_seconds:Number(select.value)});active().latency.interval_seconds=Number(select.value);notice('自动测速时间已保存','ok')}catch(error){notice(error.message,'bad')}finally{select.disabled=false}}
async function refreshProfile(id,button){const result=await busy(button,'刷新中',()=>api('/api/subscriptions/refresh',{id}),'订阅已刷新');if(result)await refresh()}
async function activateProfile(id,button){const p=state.config.subscriptions.find(item=>item.id===id);if(!await askConfirm('切换订阅',`将刷新并验证“${p?.name||'该订阅'}”。优先恢复它上次选择的节点；全部节点不可达时会自动回滚。`,'开始切换'))return;const result=await busy(button,'切换中',()=>api('/api/subscriptions/activate',{id}),'订阅已切换');if(result)await refresh()}
function toggleExpanded(button){const row=button.closest('.region'),key=expandedKey(row.dataset.profile,row.dataset.region);row.classList.toggle('open');row.classList.contains('open')?expandedRegions.add(key):expandedRegions.delete(key);saveExpandedRegions()}
function toggleRegion(button){if(regionSaving||state.operation?.active)return;const enabledCount=document.querySelectorAll('.region .toggle.on').length;if(button.classList.contains('on')&&enabledCount<=1){notice('至少保留一个地区','bad');return}const p=active(),scan=state.scans[p.id]||{},id=button.closest('.region').dataset.region,region=(scan.regions||p.regions||[]).find(item=>item.id===id);button.classList.toggle('on');const enabled=button.classList.contains('on');regionDraftProfile=p.id;regionDraft=regionDraft||{};if(enabled===savedEnabled(p,region))delete regionDraft[id];else regionDraft[id]=enabled;if(!Object.keys(regionDraft).length)regionDraft=null;const choice=nodeDraft===null?state.selected_node:nodeDraft;if(choice&&!nodeIsEnabled(choice))nodeDraft='';if(nodeDraft===''&&state.selected_node&&nodeIsEnabled(state.selected_node))nodeDraft=null;render()}
async function saveChanges(){if(!hasDraft()||regionSaving||state.operation?.active)return;const p=active(),scan=state.scans[p.id]||{},regions=(scan.regions||p.regions||[]).filter(r=>(scan.region_counts?.[r.id]||0)>0),enabled=[],excluded=[];regions.forEach(region=>(isEnabled(p,region)?enabled:excluded).push(region.id));const selected=nodeDraft===null?state.selected_node:nodeDraft;if(!selected||!nodeIsEnabled(selected)){notice('请先选择已启用地区中的节点','bad');return}regionSaving=true;render();try{await api('/api/regions/apply',{id:p.id,enabled_regions:enabled,excluded_regions:excluded,selected_node:selected});regionDraft=null;regionDraftProfile='';nodeDraft=null;regionSaving=false;await refresh();notice('地区与节点已应用','ok')}catch(error){regionSaving=false;notice(error.message,'bad');render()}}
async function testAll(button){const p=active(),result=await busy(button,'测速中',()=>api('/api/latency/test',{id:p.id}),'测速完成');if(result)await refresh()}
function chooseNode(button){if(regionSaving||state.operation?.active)return;const name=button.dataset.node;nodeDraft=name===state.selected_node?null:name;regionDraftProfile=active().id;render()}
async function poll(){try{await refresh()}catch(error){notice(error.message,'bad')}finally{setTimeout(poll,state?.operation?.active?1000:10000)}}
poll();
</script>
</body>
</html>
